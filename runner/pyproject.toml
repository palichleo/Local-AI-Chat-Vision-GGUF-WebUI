[project]
name = "atelier-generation-runtime"
version = "1.0.0"
requires-python = "==3.13.*"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "diffusers==0.41.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pillow==12.3.0",
  "numpy==2.5.3",
  "comfy-kitchen==0.2.41",
  "triton-windows==3.9.0.post30; sys_platform == 'win32'",
  "triton==3.8.0; sys_platform == 'linux'",
  "av==19.0.0",
  "imageio==2.38.0",
  "imageio-ffmpeg==0.6.0",
  "sentencepiece==0.2.2",
  "protobuf==7.36.2",
  "tokenizers==0.23.2",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "preserve"
